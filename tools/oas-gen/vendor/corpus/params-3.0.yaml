openapi: 3.0.3
info:
  title: Params
  version: "1.0.0"
paths:
  /search:
    get:
      operationId: search
      parameters:
        - name: q
          in: query
          style: form
          explode: true
          schema:
            type: string
        - name: tags
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
