openapi: 3.1.0
info:
  title: Hooks
  version: "1.0.0"
paths:
  /subscribe:
    post:
      operationId: subscribe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Subscribed
webhooks:
  newPet:
    post:
      operationId: onNewPet
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Accepted
